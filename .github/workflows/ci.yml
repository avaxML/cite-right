name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # OS/Python independent checks run once instead of 9x in the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Check code complexity
        shell: bash
        run: |
          # Fail if any function has complexity > 10 (C grade or worse)
          # --min C shows only functions with complexity >= 11
          result=$(uv run radon cc src/cite_right --min C -s 2>&1)
          if [ -n "$result" ]; then
            echo "Found functions with complexity > 10 (C grade or worse):"
            echo "$result"
            exit 1
          fi
          echo "All functions have acceptable complexity (B grade or better)"

  python:
    strategy:
      # Full Python matrix on Linux; Windows/macOS pin one version since the
      # abi3 extension is identical across Python versions
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
          prefix-key: ${{ matrix.python-version }}
      - run: uv sync --frozen --no-install-project
      - run: uv run --no-sync maturin develop
      - run: uv run --no-sync pytest -q

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - run: uv sync --frozen --no-install-project
      - run: uv run --no-sync maturin develop
      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov=cite_right --cov-report=term -q
      - name: Generate coverage badge
        # tj-actions/coverage-badge-py force-upgrades setuptools, which removed
        # pkg_resources (required by coverage-badge) in newer releases. Pin it
        # ourselves instead of relying on the action's unconstrained install.
        run: uv run --with coverage-badge --with "setuptools<81" coverage-badge -o coverage.svg -f
      # Always keep the generated badge. Never git push it to main: that branch
      # is protected, and GH006 rejects the update because the new commit has
      # no required status checks yet.
      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg
          if-no-files-found: error
      - name: Commit coverage badge to PR branch
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.head.ref != 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD_REF}" || "${HEAD_REF}" == "main" ]]; then
            echo "Refusing to push coverage.svg to '${HEAD_REF:-<empty>}'"
            exit 0
          fi
          if git diff --quiet -- coverage.svg; then
            echo "coverage.svg is unchanged"
            exit 0
          fi
          cp coverage.svg "${RUNNER_TEMP}/coverage.svg"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git checkout --force -B "${HEAD_REF}" "origin/${HEAD_REF}"
          cp "${RUNNER_TEMP}/coverage.svg" coverage.svg
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "PR branch already has this badge"
            exit 0
          fi
          git commit -m "Update coverage badge"
          git push origin "HEAD:${HEAD_REF}"

  python-spacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra spacy --no-install-project
      - name: Install pip and download spacy model
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | uv run python
          uv run python -m spacy download en_core_web_sm
      - run: PYTHONPATH=src uv run pytest -q -k spacy

  python-embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra embeddings --no-install-project
      - run: CITE_RIGHT_RUN_EMBEDDINGS_TESTS=1 PYTHONPATH=src uv run pytest -q -k embeddings

  python-tiktoken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra tiktoken --no-install-project
      - run: PYTHONPATH=src uv run pytest -q tests/test_tokenizer_tiktoken.py

  python-huggingface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra huggingface --no-install-project
      - run: PYTHONPATH=src uv run pytest -q tests/test_tokenizer_huggingface.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - run: cargo fmt --check
        working-directory: rust_core
      - run: cargo clippy -- -D warnings
        working-directory: rust_core
      - run: cargo test --verbose
        working-directory: rust_core

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - name: Run Bandit security scan
        run: uv run bandit -r src/cite_right -c pyproject.toml -f json -o bandit-report.json || true
      - name: Display Bandit results
        run: uv run bandit -r src/cite_right -c pyproject.toml
      - name: Run pip-audit for dependency vulnerabilities
        run: uv run pip-audit --desc --skip-editable
      - name: Run Semgrep security scan
        run: |
          uv pip install semgrep
          uv run semgrep scan --config=.semgrep.yml --config=auto src/
