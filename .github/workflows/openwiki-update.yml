name: OpenWiki Update

# After each merge to main, plus manual runs. Daily cron is extra coverage,
# not a substitute for merge-to-main. Wiki changes land on a PR branch;
# they are never pushed straight to main (branch protection).
#
# Free OpenRouter models rotate at runtime. scripts/openwiki_pick_model.py
# lists ids containing :free (prefer tool-calling), ranked by Artificial
# Analysis coding_index when present, else context_length, then created.
# scripts/openwiki_update.sh exports OPENWIKI_MODEL_ID to the first id and
# retries the next on 429/402/rate-limit. Do not pin a paid model id here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams.
        run: npm install --global openwiki@latest mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        # --update also handles the first run for code docs when env vars are set.
        # Model id comes from scripts/openwiki_update.sh (free OpenRouter rotation).
        run: bash scripts/openwiki_update.sh
        env:
          # OpenWiki sends anonymous reliability telemetry from CI runs.
          # Uncomment to disable:
          # OPENWIKI_TELEMETRY_DISABLED: "1"
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the OpenWiki workflow after a merge to main,
            a scheduled run, or workflow_dispatch. Review, then merge; do not
            push wiki files straight to main.
