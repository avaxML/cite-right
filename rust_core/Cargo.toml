[package]
name = "cite_right_core"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cite_right_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py311"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
